        <script>
        function toggleTheme() {

        <script>
            // 1. Set the Date in Marathi
            const now = new Date();
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            const dateStr = now.toLocaleDateString('mr-IN', options);

            // 2. Find the top bar element and set a loading message
            const infoBox = document.getElementById('date-temp');
            infoBox.innerText = `${dateStr} | हवामान लोड करत आहे...`; // "Loading weather..."

            // 3. Fetch live weather data for Pune (Latitude: 18.52, Longitude: 73.85)
            fetch('https://api.open-meteo.com/v1/forecast?latitude=18.5204&longitude=73.8567&current_weather=true')
                .then(response => response.json())
                .then(data => {
                    // Extract the current temperature and round it to a whole number
                    const currentTemp = Math.round(data.current_weather.temperature);
                    
                    // Update the top bar with the real temperature
                    infoBox.innerText = `${dateStr} | पुणे: ${currentTemp}°C`;
                })
                .catch(error => {
                    // If the user's internet is acting up, show a fallback
                    infoBox.innerText = `${dateStr} | पुणे: --°C`;
                    console.error("Could not load weather data:", error);
                });
        </script>

<!--Calender java script start-->
        <script>
        document.addEventListener("DOMContentLoaded", function() {
            buildCalendar();
        });

        function buildCalendar() {
            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth(); // January is 0
            const currentDate = today.getDate();

            // Set Header
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById("month-title").innerText = `${monthNames[currentMonth]} ${currentYear}`;

            // Grid Setup
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const firstDayOfWeek = new Date(currentYear, currentMonth, 1).getDay();
            const grid = document.getElementById("calendar-grid");
            grid.innerHTML = ""; 

            // Inject empty spaces before the 1st day of the month
            for (let i = 0; i < firstDayOfWeek; i++) {
                let empty = document.createElement("div");
                empty.className = "calendar-day empty-day";
                grid.appendChild(empty);
            }

            // Inject actual days
            for (let day = 1; day <= daysInMonth; day++) {
                let dayBox = document.createElement("div");
                dayBox.className = "calendar-day";
                dayBox.innerText = day;

                if (day > currentDate) {
                    // Disable future days
                    dayBox.classList.add("future-day");
                } else {
                    // Enable valid past/current days
                    dayBox.classList.add("active-day");
                    
                    // Format numbers to match your screenshot exactly (e.g., "01" instead of "1")
                    let dd = String(day).padStart(2, '0');
                    let mm = String(currentMonth + 1).padStart(2, '0'); 
                    let yyyy = currentYear;
                    
                    // This builds: archive/01-07-2026-VISHWADARPAN.pdf
                    let fileName = `archive/${dd}-${mm}-${yyyy}-VISHWADARPAN.pdf`;

                    dayBox.onclick = function() {
                        changePaper(fileName, dayBox);
                    };

                    // Auto-load today's paper on page refresh
                    if (day === currentDate) {
                        changePaper(fileName, dayBox);
                    }
                }
                grid.appendChild(dayBox);
            }
        }

        function changePaper(fileUrl, clickedBox) {
            // Swap PDF and Update Download Link
            document.getElementById("pdf-viewer").src = fileUrl;
            document.getElementById("download-btn").href = fileUrl;

            // Shift styling highlight to the newly selected box
            let allDays = document.getElementsByClassName("active-day");
            for (let i = 0; i < allDays.length; i++) {
                allDays[i].classList.remove("selected-day");
            }
            clickedBox.classList.add("selected-day");
        }
        </script>
<!--Calender java script end-->
